<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RateSync: Currency Converter — Lionz Studio</title>
  <meta name="description" content="RateSync: Currency Converter & Exchange Rate Tracker developed by Lionz Studio.">
  <link rel="icon" type="image/png" href="assets/ratesync_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B0E14;
      --card-bg: rgba(22, 27, 34, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --text: #F0F6FC;
      --subtext: #8B949E;
      --accent: #38BDF8;
      --accent-glow: rgba(56, 189, 248, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.1) 0%, transparent 60%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 44px 36px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5);
    }
    .app-logo {
      width: 92px;
      height: 92px;
      border-radius: 22px;
      object-fit: cover;
      margin-bottom: 22px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 28px var(--accent-glow);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      transition: transform 0.25s ease;
    }
    .app-logo:hover {
      transform: scale(1.04);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.6px;
      color: #FFFFFF;
    }
    p.lead {
      color: var(--subtext);
      font-size: 15px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    a.btn-primary {
      background: var(--accent);
      color: #0B0E14;
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    a.btn-primary:hover {
      background: #7DD3FC;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }
    a.btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
    }
    a.btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }
    footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--subtext);
      opacity: 0.8;
    }
    @media (max-width: 480px) {
      .card {
        padding: 32px 24px;
      }
      .app-logo {
        width: 80px;
        height: 80px;
      }
      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="assets/ratesync_logo.png" alt="RateSync Logo" class="app-logo">
    <h1>RateSync</h1>
    <p class="lead">Currency Converter & Exchange Rate Tracker developed by Lionz Studio.</p>

    <div class="links">
      <a href="privacy/ratesync/" class="btn btn-primary" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        Privacy Policy & Compliance
      </a>
      <a href="/app-ads.txt" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
        </svg>
        Authorized Digital Sellers (app-ads.txt)
      </a>
      <a href="mailto:lionzstudio.dev@gmail.com" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        Contact Support
      </a>
    </div>

    <footer>
      &copy; 2026 Lionz Studio. All rights reserved.
    </footer>
  </div>
</body>
</html>
