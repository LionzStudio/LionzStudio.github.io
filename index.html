<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lionz Studio — Developer Portal</title>
  <style>
    :root {
      --bg: #0B0E14;
      --card-bg: rgba(22, 27, 34, 0.8);
      --border: rgba(255, 255, 255, 0.1);
      --text: #F0F6FC;
      --subtext: #8B949E;
      --accent: #38BDF8;
      --accent-glow: rgba(56, 189, 248, 0.2);
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .logo-badge {
      display: inline-block;
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #0284C7, #0369A1);
      line-height: 72px;
      font-size: 32px;
      font-weight: bold;
      color: white;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px var(--accent-glow);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      font-weight: 700;
    }
    p.lead {
      color: var(--subtext);
      font-size: 15px;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.btn {
      display: block;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    a.btn-primary {
      background: var(--accent);
      color: #0B0E14;
    }
    a.btn-primary:hover {
      background: #7DD3FC;
      transform: translateY(-2px);
    }
    a.btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
    }
    a.btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }
    footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--subtext);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">RS</div>
    <h1>RateSync</h1>
    <p class="lead">Currency Converter & Real-Time Exchange Rate Tracker developed by Lionz Studio.</p>

    <div class="links">
      <a href="https://lionzstudio.github.io/ratesync-privacy/" class="btn btn-primary" target="_blank" rel="noopener">Privacy Policy & Compliance</a>
      <a href="/app-ads.txt" class="btn btn-secondary">Authorized Digital Sellers (app-ads.txt)</a>
      <a href="mailto:lionzstudio.dev@gmail.com" class="btn btn-secondary">Contact Support</a>
    </div>

    <footer>
      &copy; 2026 Lionz Studio. All rights reserved.
    </footer>
  </div>
</body>
</html>
