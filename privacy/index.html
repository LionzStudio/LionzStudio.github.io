<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policies & Legal Compliance — Lionz Studio</title>
  <meta name="description" content="Official Privacy Policies and Data Transparency Disclosures for Lionz Studio mobile applications.">
  <link rel="icon" type="image/png" href="../assets/ratesync_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B0E14;
      --card-bg: rgba(22, 27, 34, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --text: #F8FAFC;
      --subtext: #8B949E;
      --accent: #38BDF8;
      --accent-glow: rgba(56, 189, 248, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 44px 36px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.6px;
      margin-bottom: 8px;
      color: #FFFFFF;
    }
    p.lead {
      color: var(--subtext);
      font-size: 14.5px;
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .policy-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .policy-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }
    .policy-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .policy-title {
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
      text-align: left;
    }
    .policy-sub {
      font-size: 12px;
      color: var(--subtext);
      text-align: left;
    }
    .policy-arrow {
      color: var(--accent);
      font-size: 18px;
      font-weight: bold;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--subtext);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .back-btn:hover {
      color: var(--accent);
    }
    footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--subtext);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Privacy Policies</h1>
    <p class="lead">Select an application below to view its official privacy and data policy.</p>

    <div class="policy-list">
      <a href="ratesync/" class="policy-item">
        <div>
          <div class="policy-title">RateSync: Currency Converter</div>
          <div class="policy-sub">Package: com.ratesync.currencyconverter</div>
        </div>
        <span class="policy-arrow">→</span>
      </a>
    </div>

    <div>
      <a href="../" class="back-btn">← Back to Lionz Studio Home</a>
    </div>

    <footer>
      &copy; 2026 Lionz Studio. All rights reserved.
    </footer>
  </div>
</body>
</html>
